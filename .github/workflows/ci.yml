name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run ruff check .

      - run: uv run python -m unittest discover -s tests

      - name: Run mypy
        run: uv run mypy build.py extract.py

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.6.2'

      - run: pnpm --dir webui-src install --frozen-lockfile

      - name: Download Tailscale (current version)
        run: |
          VERSION=$(cat src/version | tr -d '\n' | sed 's/\.0$//')
          ./update_tailscale.sh "$VERSION"

      - name: Build package
        run: uv run python build.py build

      - name: Verify package
        run: uv run python build.py verify dist/*.tpk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-tpk
          path: dist/*.tpk
          retention-days: 7
